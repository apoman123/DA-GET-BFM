# Continuous integration: lock check, install, byte-compile, URDF download, and the full
# test suite (unit tests, the pretraining and BFM training scripts end to end on MuJoCo,
# the zero-shot options, and the documentation link check). Isaac Lab and the CUDA Graph
# test need a GPU and are skipped here; see docs/development.md.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for PyTorch's CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install the project with every extra (MuJoCo, converters, validation)
        run: uv sync --locked --all-extras

      - name: Byte-compile the library, scripts and tests
        run: uv run python -m compileall -q model scripts tests

      - name: Download the robot URDFs used by the tests and the morphology generator
        run: uv run python scripts/download_urdfs.py

      - name: Run the test suite
        run: uv run pytest -q -ra
