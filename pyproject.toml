[project]
name = "da-get-bfm"
version = "0.1.0"
description = "Dynamic-aware Graph Embodiment Transformer and cross-embodiment behavior foundation model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "numpy>=2.2.6",
    "safetensors>=0.8.0",
    "scipy>=1.13",
    "tensorboard>=2.14",
    "torch>=2.2",
    "transformers>=4.46",
]

[project.optional-dependencies]
validation = [
    "h5py>=3.16.0",
]
convert = [
    "numcodecs>=0.13.1",
]
sim = [
    "mujoco>=3.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
