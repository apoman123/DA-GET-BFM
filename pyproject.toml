[project]
name = "da-get-bfm"
version = "0.1.0"
description = "GET (Graph Embodiment Transformer) encoder with per-DoF tokens built from URDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
